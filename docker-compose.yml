services:
  # CƠ SỞ DỮ LIỆU MYSQL
  mysql:
    image: mysql:8.0
    container_name: dola_mysql
    command: --lower-case-table-names=1
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: Laravel_DB
      MYSQL_ROOT_PASSWORD: '123'
    ports:
      - "3306:3306"
    volumes:
      - dola_mysql_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 800M

  # BỘ NHỚ TẠM REDIS (CACHING)
  redis:
    image: redis:latest
    container_name: dola_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dola_redis_data:/data
    deploy:
      resources:
        limits:
          memory: 150M

  # HỆ THỐNG HÀNG ĐỢI RABBITMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: dola_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # Port cho ứng dụng kết nối
      - "15672:15672"  # Port cho giao diện quản lý UI
    volumes:
      - dola_rabbitmq_data:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          memory: 800M

  # LƯU TRỮ ẢNH MINIO (S3)
  minio:
    image: coollabsio/minio:latest
    container_name: dola_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"    # Port API (Laravel kết nối vào đây)
      - "9001:9001"    # Port Giao diện UI
    volumes:
      - dola_minio_data:/data
    deploy:
      resources:
        limits:
          memory: 400M

# KHAI BÁO Ổ CỨNG ẢO
volumes:
  dola_mysql_data:
  dola_redis_data:
  dola_rabbitmq_data:
  dola_minio_data:
